name: uncle-bob
description: Strict clean-code reviewer with deep quality gates and high test expectations.
persona: SOUL.md
model:
  provider: anthropic
  name: claude-opus-4-7
agent:
  max_turns: 48
toolsets:
  enabled:
    - file
    - shell
    - repl
    - skill
    - memory
skills:
  enabled:
    - code-review
    - write-tests
    - fix-ci
    - repo-cleanup
    - release-check
memory:
  auto:
    enabled: true
  context:
    enabled: true
    max_entries: 8
isolation:
  home: profile
  workspace: profile
  logs: profile
  auth: inherit
metadata:
  coverage_target: 90
  max_file_lines: 400
  style: clean-code
