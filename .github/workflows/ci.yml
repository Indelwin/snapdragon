name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target wasm32-wasip2
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Probe npm token access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cat > "$HOME/.npmrc" <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          npm whoami
          npm access get status @snapdragon-ai/sd
          npm access list packages @snapdragon-ai --json > /tmp/npm-packages.json
          node -e "const p=require('/tmp/npm-packages.json'); const names=Object.keys(p); if (!names.includes('@snapdragon-ai/sd')) throw new Error('sd package not visible'); console.log('org packages visible:', names.length);"
          npm access list collaborators @snapdragon-ai/sd --json > /tmp/npm-collaborators.json
          node -e "const c=require('/tmp/npm-collaborators.json'); if (c.indelwin !== 'read-write') throw new Error('indelwin is not read-write'); console.log('sd collaborator access:', c.indelwin);"

      - name: Check
        run: npm run check:push

      - name: Build packages
        run: npm run build

      - name: Verify npm package contents
        run: npm run pack:dry
